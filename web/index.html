<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>期刊缩写助手 · ISO 4 / LTWA</title>
  <meta name="description" content="基于 ISO 4 规则与 LTWA（ISSN）词表的期刊名缩写工具，纯前端运行，数据不出浏览器。">
  <meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='bold' text-anchor='middle' fill='%23ffffff' font-family='Georgia, serif'%3EJ.%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 启动加载遮罩：LTWA 词表就绪前覆盖全屏 -->
  <div id="loading-mask" role="alert" aria-live="polite">
    <div class="mask-card">
      <div id="mask-spinner" class="spinner"></div>
      <p id="mask-text" class="mask-text">正在加载 LTWA 词表（约 1.4MB）…</p>
      <p id="mask-error-msg" class="mask-error-msg" hidden></p>
      <button id="mask-retry" class="btn btn-primary" type="button" hidden>重试</button>
    </div>
  </div>

  <!-- Toast 通知容器 -->
  <div id="toast-container" aria-live="polite"></div>

  <header class="site-header">
    <div class="title-row">
      <h1>期刊缩写助手</h1>
    </div>
    <p class="subtitle">依据 ISO 4 规则、基于 LTWA（ISSN）词表，将期刊全名转换为标准缩写</p>
  </header>

  <div class="container">

    <div class="tabs" role="tablist">
      <button class="tab-btn active" type="button" data-tab="bib" role="tab" aria-selected="true">Bib 文件转换</button>
      <button class="tab-btn" type="button" data-tab="manual" role="tab" aria-selected="false">手动输入</button>
    </div>

    <main>
      <!-- Tab 1：Bib 文件转换 -->
      <section id="tab-bib" class="tab-panel active" role="tabpanel">
        <div class="card">
          <h2 class="card-title">上传 Bib 文件</h2>
          <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="拖拽 .bib 文件到此处，或点击选择文件">
            <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="11"/>
              <polyline points="9 14 12 11 15 14"/>
            </svg>
            <p class="dropzone-main">拖拽 .bib 文件到此处，或<span class="link-like">点击选择文件</span></p>
            <p class="dropzone-hint">仅接受 .bib 格式，文件不会上传到任何服务器</p>
          </div>
          <input type="file" id="file-input" accept=".bib" hidden>

          <div id="file-chip" class="file-chip" hidden>
            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span id="file-chip-name" class="chip-name"></span>
            <span id="file-chip-size" class="chip-size"></span>
            <button id="file-chip-remove" class="chip-remove" type="button" title="移除已选文件" aria-label="移除已选文件">&times;</button>
          </div>

          <div class="action-row">
            <button id="convert-btn" class="btn btn-primary" type="button">开始转换</button>
            <a href="#" id="sample-link" class="text-link">载入示例</a>
          </div>
        </div>

        <div class="card" id="result-card" hidden>
          <div class="result-head">
            <h2 class="card-title">转换报告</h2>
            <button id="download-btn" class="btn btn-secondary" type="button">下载转换后的 .bib</button>
          </div>
          <p id="report-summary" class="report-summary"></p>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>条目 Key</th>
                  <th>原期刊名</th>
                  <th>ISO 4 缩写</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="report-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Tab 2：手动输入 -->
      <section id="tab-manual" class="tab-panel" role="tabpanel">
        <div class="card">
          <h2 class="card-title">手动输入期刊名</h2>
          <textarea id="manual-input" class="manual-input" rows="5" placeholder="每行输入一个期刊全名，例如：&#10;Journal of the American Chemical Society&#10;Physical Review Letters&#10;&#10;提示：按 Ctrl + Enter 可快速生成缩写"></textarea>
          <div class="action-row">
            <button id="add-btn" class="btn btn-primary" type="button">生成缩写</button>
            <button id="copy-all-btn" class="btn btn-secondary" type="button">复制全部</button>
            <button id="export-btn" class="btn btn-secondary" type="button">导出 txt</button>
            <button id="clear-btn" class="btn btn-danger" type="button">清空列表</button>
          </div>
        </div>

        <div class="card">
          <div class="result-head">
            <h2 class="card-title">缩写结果</h2>
            <span id="manual-count" class="count-badge">共 0 条</span>
          </div>
          <p id="manual-empty" class="empty-state">还没有缩写记录。在上方输入期刊全名并点击「生成缩写」，结果会追加到此处；列表只在本次打开期间有效，刷新页面即清空。</p>
          <div class="table-wrap" id="manual-table-wrap" hidden>
            <table class="data-table">
              <thead>
                <tr>
                  <th class="col-index">#</th>
                  <th>期刊原名</th>
                  <th>ISO 4 缩写</th>
                  <th class="col-op">操作</th>
                </tr>
              </thead>
              <tbody id="manual-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>缩写规则：ISO 4，词表：LTWA（ISSN）</p>
  </footer>

  <script src="js/abbreviator.js"></script>
  <script src="js/bib.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
